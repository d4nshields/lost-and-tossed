name: Build and Deploy to Play Store

on:
  release:
    types: [published]
  
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      track:
        description: 'Deployment track (internal/alpha/beta/production)'
        required: true
        default: 'internal'
        type: choice
        options:
        - internal
        - alpha
        - beta
        - production

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.8'
        channel: 'stable'
        cache: true
        
    - name: Verify Flutter installation
      run: |
        flutter --version
        flutter doctor -v
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Analyze code
      run: flutter analyze --no-fatal-infos
      
    - name: Run unit tests
      run: flutter test --dart-define=CI=true
      
  build-and-deploy:
    name: Build and Deploy to Play Store
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.8'
        channel: 'stable'
        cache: true
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Decode keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/lost-and-tossed-upload-key.p12
    
    - name: Decode google-services.json
      run: |
        echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
        
    - name: Create key.properties
      run: |
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        # Use relative path from android folder (where build.gradle looks)
        echo "storeFile=app/lost-and-tossed-upload-key.p12" >> android/key.properties
        
        # Debug: Verify files exist
        echo "🔍 Checking signing configuration:"
        echo "key.properties exists: $([ -f android/key.properties ] && echo 'YES' || echo 'NO')"
        echo "keystore exists: $([ -f android/app/lost-and-tossed-upload-key.p12 ] && echo 'YES' || echo 'NO')"
        echo "key.properties content (without passwords):"
        grep -E "keyAlias|storeFile" android/key.properties || true
        
    - name: Verify signing setup
      run: |
        echo "🔐 Extracting SHA-1 from upload keystore:"
        keytool -list -v \
          -keystore android/app/lost-and-tossed-upload-key.p12 \
          -storetype PKCS12 \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>/dev/null | grep SHA1 || echo "Failed to extract SHA-1"
        
        echo ""
        echo "📋 Build.gradle signing config check:"
        grep -A 10 "signingConfigs" android/app/build.gradle || true
        
    - name: Determine deployment track
      id: track
      run: |
        # Default to internal
        TRACK="internal"
        
        # Check manual input first (highest priority)
        if [ "${{ github.event.inputs.track }}" != "" ]; then
          TRACK="${{ github.event.inputs.track }}"
          echo "Using manual track selection: $TRACK"
        # Check tag pattern for automatic selection
        elif [ "${{ github.event_name }}" = "release" ]; then
          TAG_NAME="${{ github.event.release.tag_name }}"
          echo "Analyzing tag: $TAG_NAME"
          
          if [[ $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha(\.[0-9]+)?$ ]]; then
            TRACK="alpha"
            echo "Alpha release detected"
          elif [[ $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta(\.[0-9]+)?$ ]]; then
            TRACK="beta"
            echo "Beta release detected (closed testing)"
          elif [[ $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc(\.[0-9]+)?$ ]]; then
            TRACK="beta"
            echo "Release candidate detected (deploying to beta)"
          elif [[ $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TRACK="production"
            echo "Production release detected"
          else
            TRACK="internal"
            echo "Unknown tag pattern, defaulting to internal"
          fi
        else
          echo "Manual trigger without track specified, using internal"
        fi
        
        echo "TRACK=$TRACK" >> $GITHUB_OUTPUT
        echo "🚀 Deploying to track: $TRACK"
        
    - name: Production release confirmation
      if: steps.track.outputs.TRACK == 'production'
      run: |
        echo "⚠️  PRODUCTION RELEASE DETECTED"
        echo "This will deploy to the production track on Google Play Store"
        echo "Tag: ${{ github.event.release.tag_name }}"
        echo "Proceeding with production deployment..."
        
    - name: Extract version from tag
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          TAG_NAME=${{ github.event.release.tag_name }}
        else
          TAG_NAME=$(git describe --tags --abbrev=0 || echo "v0.1.0")
        fi
        # Extract base version (remove pre-release suffixes)
        VERSION_NAME=${TAG_NAME#v}
        VERSION_NAME=${VERSION_NAME%%-*}  # Remove everything after first dash
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Version: $VERSION_NAME"
        
    - name: Update version in files
      run: |
        # Reserve the 1-billion range for CI-generated builds.
        # github.run_number increases with each new workflow run.
        VERSION_CODE=$((1000000000 + ${{ github.run_number }}))

        echo "🔢 GitHub workflow run: ${{ github.run_number }}"
        echo "🔢 Android version code: $VERSION_CODE"
        echo "📦 Version name: ${{ steps.version.outputs.VERSION_NAME }}"

        # Sanity checks
        if [ "$VERSION_CODE" -le 916202746 ]; then
          echo "ERROR: versionCode must exceed previous Play Store maximum (916202746)"
          exit 1
        fi

        if [ "$VERSION_CODE" -gt 2100000000 ]; then
          echo "ERROR: versionCode exceeds Google Play maximum"
          exit 1
        fi

        # Flutter obtains versionCode/versionName from pubspec.yaml
        sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION_NAME }}+${VERSION_CODE}/" pubspec.yaml

        echo "📋 Result:"
        grep "^version:" pubspec.yaml
        
    - name: Build App Bundle
      run: |
        echo "🏭 Starting build process..."
        
        # Build with verbose output to see signing details
        flutter build appbundle --release --verbose 2>&1 | tee build.log
        
        # Extract signing info from build log
        echo ""
        echo "🔍 Checking build signing configuration:"
        grep -i "signingConfig\|keystore\|SHA" build.log | tail -20 || true
        
        # Verify the built AAB
        echo ""
        echo "📦 Verifying built AAB:"
        if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
          echo "AAB file created successfully"
          ls -lh build/app/outputs/bundle/release/app-release.aab
        else
          echo "ERROR: AAB file not found!"
          exit 1
        fi
      
    - name: Upload to Play Store
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.tinkerplexlabs.lost_and_tossed
        releaseFiles: build/app/outputs/bundle/release/app-release.aab
        track: ${{ steps.track.outputs.TRACK }}
        status: completed
        inAppUpdatePriority: 2
        whatsNewDirectory: distribution/whatsnew
        releaseName: ${{ steps.version.outputs.VERSION_NAME }}
